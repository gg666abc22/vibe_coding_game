<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通關成功！</title>
    <style>
        body {
            background-color: #111111;
            color: #FFD700; /* 金黃色字體呼應真出口 */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        h1 {
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 5px rgba(255, 215, 0, 0.5);
        }
        p {
            font-size: 24px;
            color: #FFFFFF;
            margin-bottom: 40px;
        }
        .btn {
            padding: 15px 30px;
            font-size: 24px;
            font-weight: bold;
            text-decoration: none;
            background-color: #FFFFFF;
            color: #000000;
            border: 4px solid #AAAAAA;
            border-radius: 8px;
            transition: 0.2s;
        }
        .btn:hover {
            background-color: #DDDDDD;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <h1>🎉 恭喜通關！ 🎉</h1>
    <p>你成功識破了所有的陷阱與假出口，逃出生天！</p>
    <!-- 點擊後跳回遊戲主頁面重新開始 -->
    <a href="index.html" class="btn">再挑戰一次</a>
</body>
</html>
